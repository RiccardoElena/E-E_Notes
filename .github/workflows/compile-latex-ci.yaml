name: Compile Course Notes

on:
  push:
    branches:
      - master
      - main
    paths:
      - '**/[0-9A-Z]_*.tex'
      - '.github/workflows/compile-latex-ci.yaml'

permissions:
  contents: write

jobs:
  build:
    uses: RiccardoElena/UniNotes_Template/.github/workflows/latex-compile-ci.yaml@master
    with:
      pdf_name: 'Encoding_and_Encryption'
